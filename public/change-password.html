<!doctype html>
<html lang="fr">
<head>
  <base href="/smart-school/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2457d6">
  <title>SMART SCHOOL — Changer le mot de passe</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin-extra.css">
  <script src="vendor/supabase.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="supabase-client.js" defer></script>
  <script src="change-password.js" defer></script>
</head>
<body>
  <section class="role-app">
    <header class="role-header"><div><strong>SMART SCHOOL</strong><span>Changement obligatoire du mot de passe</span></div></header>
    <main class="role-content">
      <section class="role-card" style="max-width:560px;margin:48px auto">
        <p class="eyebrow">SÉCURITÉ DU COMPTE</p>
        <h1>Choisissez un nouveau mot de passe</h1>
        <p>Ce compte a reçu un mot de passe temporaire. Vous devez en choisir un nouveau avant d’accéder à votre espace.</p>
        <form id="password-change-form">
          <label for="new-password">Nouveau mot de passe</label>
          <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required>
          <label for="confirm-password">Confirmer le nouveau mot de passe</label>
          <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="200" required>
          <button class="role-button" type="submit">Enregistrer le nouveau mot de passe</button>
          <p id="password-change-message" class="role-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </section>
</body>
</html>
